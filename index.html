<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Cheat iOS | Premium Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #08080a; }
        .glass-card { background: #121216; border: 1px solid #22222a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .input-field { background: #18181d; border: 1px solid #2a2a33; transition: all 0.2s; }
        .input-field:focus { border-color: #7c3aed; outline: none; }
        .btn-primary { background: #7c3aed; transition: all 0.2s; box-shadow: 0 10px 15px -3px rgba(124, 58, 237, 0.3); }
        .btn-primary:hover { background: #6d28d9; transform: translateY(-1px); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="glass-card w-full max-w-md rounded-2xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-bold text-white tracking-tight">Painel Revendedor</h1>
            <p class="text-zinc-400 text-sm">Acesse sua conta para gerenciar suas keys</p>
        </div>

        <form action="/login" method="POST" class="space-y-5">
            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">E-mail</label>
                <input type="email" name="email" placeholder="seu@email.com" required
                    class="input-field w-full rounded-xl p-3.5 text-white placeholder-zinc-600 text-sm">
            </div>

            <div class="space-y-1.5">
                <label class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">Senha</label>
                <input type="password" name="password" placeholder="••••••••" required
                    class="input-field w-full rounded-xl p-3.5 text-white placeholder-zinc-600 text-sm">
            </div>

            <button type="submit" class="btn-primary w-full py-4 rounded-xl text-white font-bold text-sm tracking-wide uppercase mt-2">
                Acessar Painel
            </button>
        </form>

        <div class="text-center pt-2">
            <p class="text-zinc-500 text-sm">
                Não tem conta? 
                <a href="/register" class="text-purple-400 hover:text-purple-300 font-semibold transition-colors">Registre-se</a>
            </p>
        </div>
    </div>
</body>
</html>
